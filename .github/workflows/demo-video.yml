# demo-video — run by hand: builds and starts the base app (in-memory SQLite, the public dev
# login), films the guided tour in scripts/demo/record.mjs, and pushes the film to the
# `demo-recording` branch (replaced on every run), where it is picked up for the README. The
# page runs in slow motion and the film is sped back up, so it is smooth however slow the runner.
name: Demo video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      # the built app, served the way production serves it (a few bundled files, not the dev
      # server's hundreds of modules, which a frame-by-frame film would watch arrive one by one),
      # but in development: the demo data and the public dev login are there
      - run: npm run build --workspace @apps/base-app
      - name: Start the app
        working-directory: base-app
        run: |
          SERVE_DIST=true node server/main.ts > ../dev.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8787/login > /dev/null && exit 0
            sleep 2
          done
          cat ../dev.log
          exit 1
      # playwright records through its own ffmpeg build; the system ffmpeg speeds the film back up
      - run: npx --no-install playwright-core install ffmpeg
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Film the tour
        run: node scripts/demo/record.mjs
        env:
          BASE_URL: http://127.0.0.1:8787
          CHROME_PATH: /usr/bin/google-chrome
      - name: Encode
        run: |
          slow=$(node -p "require('./demo-out/timeline.json').slow")
          start=$(node -p "require('./demo-out/timeline.json').startSeconds.toFixed(2)")
          ffmpeg -y -loglevel error -ss "$start" -i demo-out/demo.webm \
            -vf "setpts=PTS/${slow},fps=30" -c:v libx264 -preset slow -crf 18 \
            -pix_fmt yuv420p -movflags +faststart -an demo-out/demo.mp4
          rm demo-out/demo.webm
          ls -la demo-out
      # pushed even when filming failed: its screenshots and the server log say why
      - name: Push the film to the demo-recording branch
        if: always()
        run: |
          mkdir -p /tmp/film/samples
          cp demo-out/*.mp4 demo-out/*.json /tmp/film/ 2>/dev/null || true
          cp demo-out/*.png /tmp/film/samples/ 2>/dev/null || true
          cp dev.log /tmp/film/dev.log
          cd /tmp/film
          git init -q -b demo-recording
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "demo film from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" demo-recording
