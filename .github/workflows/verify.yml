# verify — the whole gate, as `npm run verify` runs it locally: biome, oxlint, the colour, page
# and craft checks, the 7-day dependency quarantine, typecheck, every vitest suite, the browser
# WCAG 2.2 AA scan and the bundle budget, on Node 24.
name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # SHAs checked against upstream tags 2026-10-19: checkout v7, setup-node v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # lockfile-exact; .npmrc keeps the 7-day quarantine
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
        env:
          CHROME_PATH: /usr/bin/google-chrome
